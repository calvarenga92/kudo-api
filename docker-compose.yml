# Sobe a API e o Postgres juntos: `docker compose up --build`.
services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kudo
      POSTGRES_PASSWORD: kudo
      POSTGRES_DB: kudo
    ports:
      - "5432:5432"
    volumes:
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kudo -d kudo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://kudo:kudo@banco:5432/kudo
      PORT: 3000
      CORS_ORIGENS: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados-banco:
